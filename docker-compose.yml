services:
  jellyfetch:
    build:
      context: .
      dockerfile: Dockerfile
    # Draws the container name dynamically from your .env
    container_name: ${APP_NAME:-JellyFetch}
    restart: unless-stopped
    ports:
      # Maps the host port to the container port dynamically
      - "${PORT:-5547}:${PORT:-5547}"
    env_file:
      # Updated to look at the root directory
      - .env
    networks:
      - jellyfetch_net
    volumes:
      # 1:1 Mapping: The container internal paths now perfectly match your .env host paths
      - ${PATH_MOVIES}:${PATH_MOVIES}
      - ${PATH_TV}:${PATH_TV}
      - ${PATH_MUSIC}:${PATH_MUSIC}
      - ${PATH_SOCIAL}:${PATH_SOCIAL}
      # Named volume to persist yt-dlp cache signatures across container updates
      - jellyfetch_cache:/root/.cache/yt-dlp

# Defines an isolated bridge network for the container
networks:
  jellyfetch_net:
    driver: bridge

# Defines the persistent named volume
volumes:
  jellyfetch_cache:
    name: ${APP_NAME:-JellyFetch}_cache